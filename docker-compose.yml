services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      ORCA_HOST: 0.0.0.0
      ORCA_PORT: 8000
      ORCA_FRONTEND_ORIGIN: http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      args:
        VITE_ORCA_BACKEND_URL: http://localhost:8000
    ports:
      - "5173:4173"
    depends_on:
      backend:
        condition: service_healthy
